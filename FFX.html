<!DOCTYPE html>
<html lang="bn">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#ffffff">
<meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
<meta http-equiv="Pragma" content="no-cache">
<meta http-equiv="Expires" content="0">
<link rel="icon" type="image/jpeg" href="main-logo.jpg">
<link rel="shortcut icon" href="main-logo.jpg">
<link rel="apple-touch-icon" href="main-logo.jpg">
<meta property="og:image" content="main-logo.jpg">
<title>Nickname</title>
<script>
// =======================================================
// INSTANT CONFIG LOADER & CACHE-BUSTER (Render Live Update)
// =======================================================
window.ACCOUNT_CONFIG = window.ACCOUNT_CONFIG || {};

function syncAccountLinks() {
  var siteName = (typeof website_name !== 'undefined' ? website_name : (window.website_name || (window.ACCOUNT_CONFIG && window.ACCOUNT_CONFIG.websiteName) || '')).trim();
  if (!siteName) siteName = 'Nickname';

  document.title = siteName;
  document.querySelectorAll('[data-site-name]').forEach(function(el) {
    el.textContent = siteName;
  });
  document.querySelectorAll('[data-site-logo]').forEach(function(el) {
    el.alt = siteName;
  });

  var tgCh = (typeof telegram_channel_link !== 'undefined' ? telegram_channel_link : (window.telegram_channel_link || (window.ACCOUNT_CONFIG && window.ACCOUNT_CONFIG.telegramChannel) || '')).trim();
  var tgGrp = (typeof telegram_group_link !== 'undefined' ? telegram_group_link : (window.telegram_group_link || (window.ACCOUNT_CONFIG && window.ACCOUNT_CONFIG.telegramGroup) || '')).trim();
  var ytCh = (typeof youtube_channel_link !== 'undefined' ? youtube_channel_link : (window.youtube_channel_link || (window.ACCOUNT_CONFIG && window.ACCOUNT_CONFIG.youtubeChannel) || '')).trim();

  function sanitize(url, placeholder) {
    if (!url) return '';
    url = url.trim();
    if (!url || url.toLowerCase() === placeholder.toLowerCase() || url === '#' || (url.indexOf(' ') !== -1 && !url.startsWith('http'))) {
      return '';
    }
    if (!/^https?:\/\//i.test(url)) {
      return 'https://' + url;
    }
    return url;
  }

  var validTgCh = sanitize(tgCh, 'telegram channel link');
  var validTgGrp = sanitize(tgGrp, 'telegram group link');
  var validYtCh = sanitize(ytCh, 'YouTube channel link');

  function bindLinks(selector, url) {
    document.querySelectorAll(selector).forEach(function(el) {
      if (url) {
        el.href = url;
        el.target = '_blank';
        el.rel = 'noopener noreferrer';
        el.onclick = null;
      } else {
        el.href = '#';
        el.removeAttribute('target');
        el.onclick = function(e) {
          e.preventDefault();
        };
      }
    });
  }

  bindLinks('[data-link="telegram-channel"]', validTgCh);
  bindLinks('[data-link="telegram-group"]', validTgGrp);
  bindLinks('[data-link="youtube-channel"]', validYtCh);

  // নোটিফিকেশন পপআপের লেখা (account.js এর notification_text)
  var note = (typeof notification_text !== 'undefined' ? notification_text : (window.notification_text || (window.ACCOUNT_CONFIG && window.ACCOUNT_CONFIG.notificationText) || '')).toString();
  note = note.replace(/\\n/g, '\n').trim();
  var popEl = document.getElementById('popText');
  if (popEl && note) {
    popEl.textContent = '';
    note.split(/\r?\n/).forEach(function(line, i){
      if (i) popEl.appendChild(document.createElement('br'));
      popEl.appendChild(document.createTextNode(line));
    });
  }
}

window.syncAccountLinks = syncAccountLinks;

// Dynamically inject account.js with unique cache-busting timestamp
(function() {
  var buster = Date.now() + '_' + Math.floor(Math.random() * 1000000);
  var s = document.createElement('script');
  s.src = (location.protocol.indexOf('http') === 0) ? 'account.js?v=' + buster : 'account.js';
  s.async = false;
  s.onload = function() {
    if (typeof syncAccountLinks === 'function') syncAccountLinks();
  };
  (document.head || document.documentElement).appendChild(s);
})();
</script>
<style>
:root{--bg:#f5f8ff;--card:#fff;--bd:#e1e8f5;--v:#2563eb;--v2:#3b82f6;--gold:#93c5fd;--tx:#0f172a;--mu:#666b85;--g:linear-gradient(135deg,#3b82f6,#1d4ed8)}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
html{scroll-behavior:smooth;scrollbar-width:thin;scrollbar-color:#2563eb #f0f5ff}
::-webkit-scrollbar{width:6px;height:6px}
::-webkit-scrollbar-track{background:#f0f5ff}
::-webkit-scrollbar-thumb{background:linear-gradient(180deg,#3b82f6,#1d4ed8);border-radius:99px}
::-webkit-scrollbar-thumb:hover{background:#1d4ed8}
body{font-family:Inter,"Noto Sans Bengali",Roboto,system-ui,sans-serif;background:var(--bg);color:var(--tx);min-height:100vh;-webkit-font-smoothing:antialiased;-moz-osx-font-smoothing:grayscale;text-rendering:optimizeLegibility;overflow-x:hidden}
body::before{content:"";position:fixed;inset:0;z-index:-1;pointer-events:none;background-image:radial-gradient(600px 400px at 90% -5%,rgba(37,99,235,.12),transparent 70%),radial-gradient(500px 500px at -10% 45%,rgba(96,165,250,.14),transparent 70%);-webkit-transform:translateZ(0);transform:translateZ(0);will-change:transform}
a{color:inherit;text-decoration:none}
svg.i{width:1em;height:1em;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
svg.f{width:1em;height:1em;fill:currentColor;stroke:none}
.wrap{max-width:1000px;margin:0 auto;padding:0 16px}

/* placeholders: drop an <img> inside and it covers the shimmer */
.ph{position:relative;overflow:hidden;display:flex;align-items:center;justify-content:center;font-size:12px;font-weight:600;color:#2563eb;text-align:center;background:linear-gradient(110deg,#e6eeff 30%,#f4f8ff 50%,#e6eeff 70%) 0 0/200% 100%;animation:sh 2.4s linear infinite}
.thumb.ph{animation:none;background:#e8f0fe}
.ph picture{position:absolute;inset:0;width:100%;height:100%;display:block}
.ph img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;object-position:center;display:block}
@keyframes sh{to{background-position:-200% 0}}

/* header */
header{position:sticky;top:0;z-index:40;background:#ffffff;border-bottom:1px solid var(--bd);padding-top:env(safe-area-inset-top)}
.hd{display:flex;align-items:center;justify-content:space-between;height:68px}
.logo{display:inline-flex;align-items:center;height:44px;max-width:145px}
.logo img{height:100%;width:auto;max-width:100%;object-fit:contain;display:block}
.hr{display:flex;align-items:center;gap:12px}
.wallet{display:flex;align-items:center;gap:8px;height:42px;padding:0 16px 0 12px;border-radius:99px;background:var(--g);color:#fff;font-weight:700;font-size:15px;box-shadow:0 8px 18px -6px rgba(37,99,235,.6)}
.wallet svg{font-size:19px}
.avatar{display:inline-flex;align-items:center;justify-content:center;width:42px;height:42px;border-radius:50%;padding:2px;background:linear-gradient(135deg,#3b82f6,#1d4ed8);box-shadow:0 6px 14px -4px rgba(37,99,235,.5);cursor:pointer;transition:.2s}
.avatar:hover{transform:scale(1.05)}
.avatar:active{transform:scale(.95)}
.avatar .av-inner{width:100%;height:100%;border-radius:50%;background:#eff6ff;display:flex;align-items:center;justify-content:center;color:#2563eb}
.avatar .av-inner svg{width:21px;height:21px;stroke-width:2.2}

/* hero */
.hero{margin-top:18px;position:relative;border-radius:26px;overflow:hidden;border:1.5px solid #1e293b;box-shadow:0 4px 0 #1e293b,0 16px 36px -12px rgba(17,24,39,.28);user-select:none;-webkit-user-select:none;touch-action:pan-y;background:#050d24;cursor:grab;-webkit-transform:translateZ(0);transform:translateZ(0)}
.hero:active{cursor:grabbing}
.track{display:flex;width:100%;will-change:transform;backface-visibility:hidden;-webkit-backface-visibility:hidden;-webkit-transform:translateZ(0);transform:translateZ(0)}
.slide{flex:0 0 100%;width:100%;min-width:100%;position:relative;aspect-ratio:2/1;min-height:160px;border-radius:0;font-size:15px;overflow:hidden;background:#050d24;backface-visibility:hidden;-webkit-backface-visibility:hidden}
.slide img{pointer-events:none;-webkit-user-drag:none;user-select:none;width:100%;height:100%;object-fit:cover;object-position:center;display:block;backface-visibility:hidden;-webkit-backface-visibility:hidden}
.dots{position:absolute;left:0;right:0;bottom:14px;display:flex;justify-content:center;gap:7px;z-index:10;pointer-events:none}
.dots i{width:16px;height:5px;border-radius:6px;background:rgba(255,255,255,.45);cursor:pointer;pointer-events:auto;transition:all .4s cubic-bezier(.2,1,.3,1);box-shadow:0 1px 4px rgba(0,0,0,.45)}
.dots i.on{width:36px;background:#fff;box-shadow:0 2px 10px rgba(37,99,235,.85),0 1px 4px rgba(0,0,0,.5)}

/* quick links */
.quick{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-top:14px}
.q{display:flex;align-items:center;justify-content:center;gap:8px;padding:10px 8px;border-radius:16px;background:#fff;color:var(--tx);border:1px solid var(--bd);box-shadow:0 2px 8px rgba(20,40,90,.05);text-align:center;transition:.2s}
.q:hover{border-color:#93c5fd;box-shadow:0 6px 16px -8px rgba(37,99,235,.5)}

/* section */

/* cards */
.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:12px}
.card{position:relative;border-radius:20px;overflow:hidden;background:#fff;border:1.8px solid #111827;box-shadow:0 5px 0 #111827,0 10px 20px -3px rgba(17,24,39,.26);transition:.25s cubic-bezier(.2,1,.3,1);-webkit-transform:translateZ(0);transform:translateZ(0);backface-visibility:hidden;-webkit-backface-visibility:hidden;contain:layout paint}
.card:before{content:"";position:absolute;inset:0;border-radius:inherit;padding:1px;background:linear-gradient(160deg,rgba(155,108,255,.9),transparent 55%);-webkit-mask:linear-gradient(#000 0 0) content-box,linear-gradient(#000 0 0);-webkit-mask-composite:xor;mask-composite:exclude;opacity:0;transition:.3s;pointer-events:none;z-index:2;will-change:opacity}
.card:hover{transform:translateY(-4px);box-shadow:0 8px 0 #111827,0 18px 28px -4px rgba(17,24,39,.36)}
.card:hover:before{opacity:1}
.card:active{transform:translateY(3px);box-shadow:0 2px 0 #111827,0 6px 12px rgba(17,24,39,.25)}
.thumb{aspect-ratio:1/1;border-radius:0}
.card p{display:flex;align-items:center;justify-content:center;gap:6px;min-height:50px;padding:8px 6px;font-size:11.5px;font-weight:700;color:#111827;text-align:center;text-transform:uppercase;letter-spacing:.2px}
.v-badge{width:18px;height:18px;display:inline-block;vertical-align:-3px;margin-left:4px;flex-shrink:0}

/* download */
.dl{margin-top:36px;padding:26px 18px;text-align:center;border-radius:26px;background:linear-gradient(160deg,#e8f0ff,#fff);border:1px solid var(--bd)}
.dl h3{font-size:17px;font-weight:800;letter-spacing:.4px;margin-bottom:16px}
.play{color:#fff;display:inline-flex;align-items:center;gap:12px;padding:10px 22px 10px 16px;border-radius:14px;background:#000;border:1.5px solid #8d8d95;text-align:left;transition:.25s}
.play:hover{transform:translateY(-2px);box-shadow:0 10px 26px rgba(0,0,0,.5)}
.play svg{width:30px;height:34px}
.play small{display:block;color:#fff;font-size:10px;font-weight:500;letter-spacing:.6px}
.play b{display:block;color:#fff;font-size:22px;font-weight:600;letter-spacing:-.6px;line-height:1.05}

/* footer */
footer{margin-top:30px;padding:30px 0 150px;border-top:1px solid var(--bd)}
.flogo{width:104px;height:42px;border-radius:8px}
.ft{margin-top:20px;font-weight:700;font-size:15px;line-height:1.6}
.warn{margin-top:14px;padding:14px 16px;border-radius:16px;background:var(--card);border:1px solid var(--bd);border-left:3px solid var(--gold);color:var(--mu);font-size:13.5px;line-height:1.85}
.warn b{color:var(--tx)}
.tgbtn{display:inline-flex;align-items:center;gap:12px;margin-top:16px;padding:14px 24px 14px 18px;border-radius:16px;background:var(--g);color:#fff;font-weight:600;box-shadow:0 10px 22px -10px rgba(37,99,235,.8)}
.tgbtn svg{font-size:20px}
footer h2{margin:30px 0 12px;font-size:26px;font-weight:800;letter-spacing:-.6px}
.help{display:flex;align-items:center;gap:14px;padding:18px;border-radius:20px;background:var(--card);border:1px solid var(--bd)}
.help .ti{width:46px;height:46px;border-radius:50%;background:#0a8fd6;display:grid;place-items:center;font-size:22px;flex-shrink:0}
.help h4{display:flex;align-items:center;gap:6px;font-size:16px}
.help h4 svg{font-size:19px;color:#3b82f6}

.copy{margin-top:26px;text-align:center;color:var(--mu);font-size:12px}

/* floating support */

.fb{pointer-events:auto}
.menu{display:flex;flex-direction:column;align-items:flex-end;gap:10px;opacity:0;transform:translateY(14px) scale(.9);transform-origin:bottom right;pointer-events:none;transition:.28s}
.fab.open .menu{opacity:1;transform:none;pointer-events:auto}
.menu a{display:flex;align-items:center;gap:10px;padding:6px 6px 6px 16px;border-radius:99px;background:#fff;border:1px solid var(--bd);box-shadow:0 8px 20px rgba(20,40,90,.15);font-size:13px;font-weight:600}
.menu a span{width:38px;height:38px;border-radius:50%;display:grid;place-items:center;font-size:19px;color:#fff}
.fb{position:relative;width:60px;height:60px;border:0;border-radius:50%;background:var(--g);color:#fff;font-size:26px;display:grid;place-items:center;cursor:pointer;box-shadow:0 0 0 6px rgba(37,99,235,.18),0 0 0 14px rgba(37,99,235,.08),0 14px 26px -8px rgba(37,99,235,.8)}
.fb .x,.fab.open .fb .h{display:none}
.fab.open .fb .x{display:block}

/* bottom nav */
.nav{position:fixed;left:50%;transform:translateX(-50%) translateZ(0);-webkit-transform:translateX(-50%) translateZ(0);bottom:calc(6px + env(safe-area-inset-bottom,0px));width:min(calc(100% - 20px),520px);height:68px;z-index:45;display:grid;grid-template-columns:repeat(5,1fr);border-radius:24px;background:rgba(255,255,255,.94);backdrop-filter:blur(20px);-webkit-backdrop-filter:blur(20px);border:1px solid var(--bd);box-shadow:0 10px 28px rgba(20,40,100,.16);backface-visibility:hidden;-webkit-backface-visibility:hidden;will-change:transform}
.nav a{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px;color:var(--mu);font-size:10.5px;font-weight:600;position:relative;transition:.2s}
.nav a svg{font-size:23px}
.nav a.on{color:var(--v)}
.nav a.on:after{content:"";position:absolute;top:5px;width:18px;height:3px;border-radius:3px;background:var(--v)}
.nav a.add{justify-content:flex-end;padding-bottom:9px}
.nav a.add i{position:absolute;top:-22px;width:58px;height:58px;border-radius:50%;background:var(--g);color:#fff;display:grid;place-items:center;border:4px solid #fff;box-shadow:0 10px 22px -4px rgba(37,99,235,.8)}
.nav a.add i svg{font-size:26px}
@media(min-width:760px){.grid{grid-template-columns:repeat(6,1fr)}.slide{aspect-ratio:2.1/1}.nav{display:none!important}.fab{right:max(16px,calc(50% - 480px));bottom:24px}footer{padding-bottom:50px}}
@media(prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}

/* popup */
.pop{position:fixed;inset:0;z-index:100;display:flex;align-items:center;justify-content:center;padding:20px 20px 46px;background:rgba(10,22,55,.55);backdrop-filter:blur(7px);-webkit-backdrop-filter:blur(7px);opacity:0;pointer-events:none;transition:opacity .3s}

.pbtn{display:inline-flex;align-items:center;gap:8px;margin-top:16px;padding:12px 24px;border-radius:12px;background:var(--g);color:#fff;font-weight:600;box-shadow:0 10px 22px -10px rgba(37,99,235,.9)}
.pclose{position:absolute;left:50%;bottom:-27px;transform:translateX(-50%);display:flex;align-items:center;gap:8px;padding:14px 32px;border:0;border-radius:99px;background:var(--g);color:#fff;font-family:inherit;font-weight:800;font-size:16px;line-height:1;letter-spacing:.6px;cursor:pointer;box-shadow:0 0 0 5px rgba(255,255,255,.9),0 14px 26px -8px r
